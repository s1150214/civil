<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公務小達人｜三關人氣投票</title>
<style>
:root{--ink:#283747;--muted:#617181;--pink:#f7dce5;--rose:#c45c7b;--cream:#fffaf4;--mint:#dff1e9;--line:#eadfe0;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fffaf4,#f7f3fb 60%,#eef8f3);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);line-height:1.6}
button,input{font:inherit}button,a{touch-action:manipulation}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px max(18px,calc((100% - 1100px)/2));background:#ffffffd9;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:800}.top-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tag-soft{background:var(--pink);padding:5px 12px;border-radius:999px;font-size:.9rem}.top-mini,.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:9px 13px;cursor:pointer}
.portal-nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px}.portal-nav a{color:#495b68;text-decoration:none;padding:8px 13px;border-radius:12px}.portal-nav a[aria-current=page]{background:white;box-shadow:0 3px 12px #34495e12}
main{max-width:1000px;margin:0 auto;padding:12px 18px 48px}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:28px 30px;border-radius:28px;background:linear-gradient(120deg,#fff,#fff1f5);box-shadow:0 12px 36px #6a50600c}.eyebrow{color:var(--rose);font-weight:800;font-size:.9rem}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.2;margin:10px 0}h1 span{color:var(--rose)}.hero p{color:var(--muted);margin-bottom:0}.mascot{font-size:5rem;min-width:120px;text-align:center}.panel{margin-top:20px;padding:24px;background:#ffffffed;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px #34495e0a}.progress{height:8px;background:#f0e8ed;border-radius:99px;overflow:hidden;margin:12px 0 20px}.progress div{height:100%;background:linear-gradient(90deg,#e8a5bb,#9ed9c1);transition:width .2s}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:var(--muted)}.step-title{font-size:1.45rem;margin:0}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;margin:14px 0;outline-color:#c45c7b}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:15px;padding:13px;background:white;cursor:pointer;min-height:65px}.choice:has(input:checked){border-color:#ce7894;background:#fff2f6}.choice input{margin-top:5px;accent-color:#c45c7b;transform:scale(1.1)}.choice small{display:block;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}.primary{background:#bd5a7b;color:white;border:0;border-radius:13px;padding:12px 20px;font-weight:800;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.status-list{display:grid;gap:10px}.status-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,220px);gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.status-item select{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:white}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#283747;color:white;padding:11px 18px;border-radius:13px;box-shadow:0 8px 24px #0002;display:none;max-width:90vw;z-index:9}.note{white-space:pre-wrap;color:#a13e55;font-size:.94rem;margin-top:12px}.summary{background:#f1faf5;border-radius:16px;padding:18px}.field{display:grid;gap:5px;margin:12px 0}.field input{border:1px solid var(--line);padding:11px;border-radius:10px;width:100%}footer{text-align:center;color:var(--muted);padding:20px;font-size:.9rem}
@media(max-width:600px){.hero{padding:22px;align-items:flex-start}.mascot{font-size:3.5rem;min-width:55px}.panel{padding:17px}.status-item{grid-template-columns:1fr}.topline{padding:12px 16px}}
</style>
</head>
<body>
<header class="topline">
  <div class="brand">🏫 TAIPEION × 臺北市教師研習中心</div>
  <div class="top-meta"><span class="tag-soft">🌷 同仁體驗互動小遊戲</span><button class="top-mini" id="resetBtn" type="button">↻ 清除並重來</button></div>
</header>
<nav class="portal-nav" aria-label="網站導覽">
  <a href="index.html" aria-current="page">🗳️ ① 三關投票與統計</a>
  <a href="Game.html">🐻 ② 公務情境闖關</a>
  <a href="#" id="guideLink" target="_blank" rel="noopener noreferrer">📘 新公文系統操作教學 ↗</a>
</nav>
<main>
<section class="hero"><div><span class="eyebrow">⭐ 你的公務系統探險地圖</span><h1>公務小達人 <span>♡</span><br>三關人氣投票！</h1><p>哪些 TAIPEION 系統是你覺得教研中心同仁會用到的呢？<br>依序完成 <b>共通性 → 一條鞭 → 跨機關</b>，每關選出 3 個系統，再盤點自己曾接觸或使用過的系統。</p></div><div class="mascot" aria-hidden="true">🐻✨</div></section>
<section class="panel" id="app" aria-live="polite"></section>
<footer>同仁體驗互動小遊戲｜請勿輸入密碼或其他敏感個人資料。</footer>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
// 請依實際業務需求修改這三組系統名稱；目前先放示例項目。
const GROUPS = [
 {title:'第一關｜共通性系統',hint:'選出你認為同仁最常用到的 3 個系統',items:['電子郵件系統','差勤/出勤系統','公文管理系統','線上簽核系統','會議室預約系統','知識文件查詢系統']},
 {title:'第二關｜一條鞭系統',hint:'選出你認為同仁最常用到的 3 個系統',items:['人事資料管理系統','主計/會計系統','政府採購系統','薪資管理系統','財產管理系統','差旅費報支系統']},
 {title:'第三關｜跨機關系統',hint:'選出你認為同仁最常用到的 3 個系統',items:['政府資料開放平台','跨機關公文交換系統','共同供應契約平台','全國教師在職進修資訊網','政府電子採購網','其他跨機關服務平台']}
];
const STATUS_OPTIONS = ['尚未接觸','聽過但未使用','曾經使用','目前仍在使用'];
const STORAGE_KEY='taipeion_vote_v1';
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');
let sending=false;
function newState(){return {clientId:makeId(),name:'',step:0,votes:[[],[],[]],experience:{},submitted:false,receipt:null,search:''}}
function makeId(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.votes)&&s.votes.length===3)return {...newState(),...s}}catch(e){}return newState()}
let state=loadState();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){toastEl.textContent=msg;toastEl.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toastEl.style.display='none',3500)}
function selectedNames(){return [...new Set(state.votes.flat())]}
function render(){
 if(state.submitted){renderDone();return}
 const finalStep=state.step===3;
 const pct=state.step/4*100;
 let content='';
 if(state.step<3){
  const g=GROUPS[state.step],chosen=state.votes[state.step];
  const items=g.items.filter(x=>x.toLowerCase().includes(state.search.toLowerCase()));
  content=`<div class="row"><div><div class="muted">第 ${state.step+1} 關，共 3 關</div><h2 class="step-title">${esc(g.title)}</h2><div class="muted">${esc(g.hint)}</div></div><b>${chosen.length} / 3</b></div>
  <div class="progress"><div style="width:${pct}%"></div></div>
  <label class="field">填答識別名稱（可填部門/暱稱，請勿填身分證字號等敏感資料）<input id="nameInput" maxlength="80" value="${esc(state.name)}" placeholder="例如：研習組同仁"></label>
  <input class="search" id="searchInput" type="search" value="${esc(state.search)}" placeholder="🔎 搜尋系統名稱" aria-label="搜尋系統名稱">
  <div class="choices">${items.map(n=>`<label class="choice"><input type="checkbox" data-pick="${esc(n)}" ${chosen.includes(n)?'checked':''}><span><b>${esc(n)}</b><small>${chosen.includes(n)?'已選取':'點選加入投票'}</small></span></label>`).join('')||'<p class="muted">找不到符合的項目。</p>'}</div>
  <div class="actions"><button class="secondary" id="backBtn" ${state.step===0?'disabled':''}>← 上一關</button><button class="primary" id="nextBtn">${state.step===2?'下一步：使用經驗 →':'下一關 →'}</button></div>`;
 } else {
  const names=[...new Set(GROUPS.flatMap(g=>g.items))];
  content=`<div class="row"><div><div class="muted">最後一步</div><h2 class="step-title">📋 使用經驗盤點</h2><div class="muted">請標記你對曾投票或想盤點的系統之使用情況。</div></div></div><div class="progress"><div style="width:100%"></div></div>
  <div class="status-list">${names.map(n=>`<label class="status-item"><span>${esc(n)} ${selectedNames().includes(n)?'<small>（你已投票）</small>':''}</span><select data-status="${esc(n)}"><option value="">請選擇</option>${STATUS_OPTIONS.map(s=>`<option ${state.experience[n]===s?'selected':''}>${s}</option>`).join('')}</select></label>`).join('')}</div>
  <div class="actions"><button class="secondary" id="backBtn">← 返回第三關</button><button class="primary" id="submitBtn">☁️ 送出填答</button></div>
  <p class="muted">送出後會寫入管理者設定的 Google 試算表。若失敗，請先確認部署設定，再按重試。</p><div id="sendNote" class="note"></div>`;
 }
 app.innerHTML=content;
 const nameInput=document.getElementById('nameInput');if(nameInput)nameInput.addEventListener('input',e=>{state.name=e.target.value;save()});
 const search=document.getElementById('searchInput');if(search)search.addEventListener('input',e=>{const pos=e.target.selectionStart;state.search=e.target.value;const val=state.search;render();const n=document.getElementById('searchInput');n.focus();n.setSelectionRange(pos,pos)});
 app.querySelectorAll('[data-pick]').forEach(input=>input.addEventListener('change',()=>{const n=input.dataset.pick,arr=state.votes[state.step];if(input.checked){if(arr.length>=3){input.checked=false;showToast('🌷 每關最多選 3 個喔！');return}arr.push(n)}else state.votes[state.step]=arr.filter(x=>x!==n);save();render()}));
 app.querySelectorAll('[data-status]').forEach(select=>select.addEventListener('change',()=>{state.experience[select.dataset.status]=select.value;save()}));
 const back=document.getElementById('backBtn');if(back)back.addEventListener('click',()=>{if(state.step>0){state.step--;state.search='';save();render();window.scrollTo({top:0,behavior:'smooth'})}});
 const next=document.getElementById('nextBtn');if(next)next.addEventListener('click',()=>{if(state.votes[state.step].length!==3){showToast('🌷 請先勾滿 3 個系統喔');return}state.step++;state.search='';save();render();window.scrollTo({top:0,behavior:'smooth'})});
 const submit=document.getElementById('submitBtn');if(submit)submit.addEventListener('click',submitSurvey);
}
function renderDone(){app.innerHTML=`<div class="summary"><h2>🎉 填答已完成！</h2><p>收據編號：<b>${esc(state.receipt?.receiptId||'已保存')}</b></p><p>你的投票已在本機標記為完成。若要開始新一份填答，請按右上方「清除並重來」。</p><button class="secondary" id="receiptBtn">查看送出摘要</button><pre id="receipt" style="white-space:pre-wrap;display:none"></pre></div>`;document.getElementById('receiptBtn').onclick=()=>{const p=document.getElementById('receipt');p.style.display=p.style.display==='none'?'block':'none';p.textContent=JSON.stringify({name:state.name,votes:state.votes,experience:state.experience,receipt:state.receipt},null,2)}}
async function submitSurvey(){
 if(sending||state.submitted)return;
 if(!state.votes.every(v=>v.length===3)){showToast('請確認三關都各選 3 個系統');return}
 sending=true;const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='☁️ 正在寫入試算表…';
 const payload={clientId:state.clientId,name:state.name.trim(),votes:state.votes.map(v=>v.slice()),experience:state.experience,submittedAt:new Date().toISOString()};
 const scriptURL='請貼上你的_GOOGLE_APPS_SCRIPT_WEB_APP_EXEC_URL';
 const onSuccess=(result)=>{
  if(!result||result.ok!==true){onFailure(new Error(result?.error||'伺服器未確認儲存成功'));return}
  state.submitted=true;state.receipt=result;state.step=4;save();sending=false;render();window.scrollTo({top:0,behavior:'smooth'});showToast(result.duplicate?'此份填答已存在，不重複計票':'✅ 已寫入 Google 試算表！');
 };
 const onFailure=(err)=>{
  sending=false;const b=document.getElementById('submitBtn');
  if(b){b.disabled=false;b.textContent='☁️ 重試送出'}
  const msg=err?.message||String(err),note=document.getElementById('sendNote');
  if(note)note.textContent='⚠️ 寫入結果無法確認：'+msg+'\n請至 Apps Script「執行項目」查看後端錯誤。若資料可能已寫入，請使用相同 clientId 去重後再重試。';
  showToast('⚠️ 上傳失敗，請檢查 Apps Script 部署與網路');
 };
 // 建議將本 HTML 放在 Apps Script 專案的 index.html，由 HtmlService 提供。
 // 這時使用 google.script.run，不會遇到一般跨網域 fetch 的 CORS 讀取限制。
 if(window.google && google.script && google.script.run){
  google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).submitVote(payload);
  return;
 }
 // 若 HTML 放在其他網站，請設定 /exec 網址；Apps Script 的跨網域重新導向仍可能被瀏覽器封鎖。
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(scriptURL)){
  onFailure(new Error('尚未設定 Apps Script 網址，或建議改由 Apps Script HtmlService 部署本頁。'));return;
 }
 try{
  const response=await fetch(scriptURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  const raw=await response.text();let result;
  try{result=JSON.parse(raw)}catch(e){throw new Error('伺服器未回傳 JSON。請確認部署網址、doPost(e) 與存取權限。')}
  if(!response.ok)throw new Error('HTTP '+response.status);
  onSuccess(result);
 }catch(err){onFailure(err)}
}
document.getElementById('resetBtn').addEventListener('click',()=>{if(!confirm('確定清除本機填答並重新開始？已寫入試算表的資料不會刪除。'))return;localStorage.removeItem(STORAGE_KEY);state=newState();sending=false;render();showToast('已清除本機填答')});
document.getElementById('guideLink').addEventListener('click',e=>{e.preventDefault();showToast('請把新公文系統操作教學網址填入 HTML 的 guideLink href')});
render();
</script>
</body>
</html>
