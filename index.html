function submitSurvey(){
  if(sending)return;
  sending=true;
  const btn=el('submitBtn');
  if(btn){btn.disabled=true;btn.textContent='☁️ 正在寫入試算表…'}
  
  const experience={};
  markedNames().forEach(n=>{experience[n]=getStatus(n)});
  const payload={clientId:state.clientId,name:state.name,votes:state.votes.map(v=>v.slice()),experience};

  // 透過 Fetch 發送 POST 請求至提供的 Apps Script 網址
  fetch('https://script.google.com/macros/s/AKfycbx7_GqDp6XQDGG-k8UaTGWSx9eqf2UPdjCEYKepVp37fjU7Toxj8drAj-HAiPFc_3hUhw/exec', {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // 避免發生 CORS 預檢問題
  }).then(res => res.json()).then(result => {
    sending=false;
    if(!result||!result.ok){
      const b=el('submitBtn');
      if(b){b.disabled=false;b.textContent='☁️ 再試一次送出'}
      showToast('資料儲存未確認，請再試一次');
      return;
    }
    state.submitted=true;
    state.receipt=result;
    state.step=4;
    save();
    render();
    window.scrollTo({top:0,behavior:'smooth'});
    celebrate();
    showToast(result.duplicate?'✅ 此份填答已存在，不重複計票':'✅ 已寫入 Google 試算表！');
  }).catch(err => {
    sending=false;
    const b=el('submitBtn');
    if(b){b.disabled=false;b.textContent='☁️ 重試送出'}
    const msg=(err&&err.message)||String(err);
    const note=el('sendNote');
    if(note)note.textContent='⚠️ 寫入失敗：'+msg;
    showToast('⚠️ 上傳失敗，資料仍在此瀏覽器，可重試');
  });
}
function togglePick(n){const selected=state.votes[state.step];if(selected.includes(n)){state.votes[state.step]=selected.filter(s=>s!==n)}else if(selected.length<3)selected.push(n);else{showToast('🌷 每關最多選 3 個喔！');return}save();renderPoll()}
function setExperience(n,to){if(!membership.has(n))return;state.experience[n]=getStatus(n)===to?'none':to;save();renderInventory()}
function celebrate(){const host=el('confetti');host.innerHTML='';const colors=['#f6a6bd','#f6cf7c','#b6a8f3','#90d9bc','#a4d8f9'];for(let i=0;i<42;i++){const d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.background=colors[i%colors.length];d.style.animationDelay=Math.random()*.75+'s';d.style.transform=`rotate(${Math.random()*90}deg)`;host.appendChild(d)}setTimeout(()=>host.innerHTML='',2400)}
function downloadCSV(){const header=['暱稱（選填）','資料類型','關卡／分類','系統名稱','接觸或使用狀態','填寫日期'];const now=new Date();const stamp=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const rows=[...state.votes.flatMap((group,i)=>group.map(n=>[state.name,'投票',categories[i].name,n,'',stamp])),...markedNames().map(n=>[state.name,'使用經驗',membership.get(n).map(i=>categories[i].name).join('、'),n,getStatus(n)==='used'?'實際使用過':'接觸但未操作',stamp])];const safeCell=v=>{const s=String(v);return '"'+(/^[\s]*[=+\-@]/.test(s)?"'"+s:s).replace(/"/g,'""')+'"'};const csv='\uFEFF'+[header,...rows].map(row=>row.map(safeCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`TAIPEION_投票與使用經驗_${stamp}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);showToast('📥 已下載僅包含投票與勾選經驗的 CSV')}
function updateListFromSearch(id){const input=el(id);if(!input)return;const pos=input.selectionStart??input.value.length;let value=input.value;if(id==='search')state.search=value;else if(id==='inventorySearch')state.inventorySearch=value;else state.resultSearch=value;save();render();const nextInput=el(id);if(nextInput){nextInput.focus();try{nextInput.setSelectionRange(pos,pos)}catch(e){}}}
function handleClick(e){const stepBtn=e.target.closest('[data-step]');if(stepBtn){setStep(Number(stepBtn.dataset.step));return}const pick=e.target.closest('[data-pick]');if(pick&&state.step<3&&!state.submitted){togglePick(pick.dataset.pick);return}const rm=e.target.closest('[data-remove]');if(rm&&state.step<3&&!state.submitted){togglePick(rm.dataset.remove);return}const stat=e.target.closest('[data-status]');if(stat&&state.step===3&&!state.submitted){setExperience(stat.dataset.system,stat.dataset.status);return}const flt=e.target.closest('[data-filter]');if(flt){if(flt.dataset.filterKind==='inventory')state.filter=flt.dataset.filter;else state.resultFilter=flt.dataset.filter;save();render();return}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case'next':next();break;case'back':setStep(Math.max(0,state.step-1));break;case'expand':state.expanded[state.step]=true;save();renderPoll();break;case'compact':state.expanded[state.step]=false;save();renderPoll();break;case'toggleInventory':state.expandedInventory=!state.expandedInventory;save();renderInventory();break;case'csv':downloadCSV();break;case'print':window.print();break;case'reset':if(window.confirm(state.submitted?'已送出的舊資料仍會留在 Google 試算表。確定要開始新的填答嗎？':'確定要清除這台電腦上的投票紀錄、重新填答嗎？')){state=blank();save();render();window.scrollTo({top:0,behavior:'smooth'});showToast('已重新開始 🌷')}break}}
document.addEventListener('click',handleClick);document.addEventListener('input',e=>{if(['search','inventorySearch','resultSearch'].includes(e.target.id))updateListFromSearch(e.target.id);else if(e.target.id==='nickname'){state.name=e.target.value;save()}});render();
</script>
</body>
